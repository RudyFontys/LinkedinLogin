name: Docker Image CI (ARM64)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (voor ARM-emulatie)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GH_PAT }}
          default_bump: patch

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64  # Alleen ARM64 bouwen
          push: true
          tags: |
            rudyfontys/linkedin-login:latest
            rudyfontys/linkedin-login:${{ steps.tag_version.outputs.new_tag }}

      - name: Update Kubernetes Deployment via Argo CD
        uses: argoproj-labs/argocd-image-updater@v1.0.0
        with:
          argocd-server: https://84.85.191.38
          argocd-token: ${{ secrets.ARGOCD_TOKEN }}
          application-name: linkedinlogin
          image: rudyfontys/linkedin-login
          tag: ${{ steps.tag_version.outputs.new_tag }}