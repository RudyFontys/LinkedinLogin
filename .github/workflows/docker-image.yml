name: Docker Image LinkedinLogin # Naam van mijn Workflow

on:  # Als er een event gebeurd worden deze workflows getriggerd
  push:
    branches: [ "main" ] # Trigger deze Workflow als er iemand naar "main" pushed
  pull_request:
    branches: [ "main" ] # Als er een Pull request (merge) met de "main" wordt gedaan, trigger de Workflow

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
    - uses: actions/checkout@v4 # checkout action in Github, zie action.yml file in https://github.com/actions/checkout

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v3 # build-push-action in Github, zie action.yml file in https://github.com/marketplace/actions/build-and-push-docker-images
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/linkedin-login:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/linkedin-login:${{ github.sha }}
      
    
   # - name: Build the Docker image
   #   run: docker build . --file Dockerfile --tag my-image-name:$(date +%s
    




