name: Docker Image LinkedinLogin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
  uses: docker/build-push-action@v4
  with:
    push: true
    tags: |
      rudyfontys/linkedin-login:latest
      rudyfontys/linkedin-login:${{ github.ref_name }}
