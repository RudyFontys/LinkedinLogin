name: Docker Image LinkedinLogin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nodig voor git-tags

      # 2. Automatisch versie verhogen (patch: 1.0.0 → 1.0.1)
      - name: Bump version
        uses: mathieudutour/github-tag-action@v6.1
        id: tag_version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Automatisch gegenereerd door GitHub
          default_bump: patch  # Opties: major, minor, patch

      # 3. Login naar Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4. Build en push Docker image met nieuwe tag
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            rudyfontys/linkedin-login:latest
            rudyfontys/linkedin-login:${{ steps.tag_version.outputs.new_tag }}