name: linkedin-app Build, Push and Deploy

on:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: rudyfontys/linkedin-app
  ARGOCD_SERVER: https://84.85.191.38
  ARGOCD_APP_NAME: linkedin-app

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Haal alle Git history op voor versiebump

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GH_PAT }}  # GitHub Personal Access Token (repo scope)
          default_bump: patch  # patch (1.0.1 → 1.0.2), minor (1.0 → 1.1), major (1 → 2)
          tag_prefix: ""  # Geen "v" voor de versie (bijv. "v1.0.1" → "1.0.1")

  build-and-push:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64  # Multi-arch build
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ needs.bump-version.outputs.new_version }}

  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Update Kubernetes Deployment via Argo CD
        uses: argoproj-labs/argocd-image-updater@v1.0.0
        with:
          argocd-server: ${{ env.ARGOCD_SERVER }}
          argocd-token: ${{ secrets.ARGOCD_TOKEN }}
          application-name: ${{ env.ARGOCD_APP_NAME }}
          image: ${{ env.DOCKER_IMAGE }}
          tag: ${{ needs.bump-version.outputs.new_version }}  # Gebruik de nieuwe versie
          force-update: true  # Forceer een update