name: linkedin-app Build, Push and Deploy

on:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: rudyfontys/linkedin-app
  ARGOCD_SERVER: https://84.85.191.38
  ARGOCD_APP_NAME: linkedin-app

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Haal alle Git history op voor versiebump

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GH_PAT }}
          default_bump: patch
          tag_prefix: ""

  build-and-push:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ needs.bump-version.outputs.new_version }}

  update-deployment:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Deployment image
        run: |
          # Vervang image tag in deployment.yaml
          sed -i "s|image: rudyfontys/linkedin-app:.*|image: rudyfontys/linkedin-app:${{ needs.bump-version.outputs.new_version }}|g" kubernetes/deployment.yaml

      - name: Commit and push Deployment update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Alleen committen als er wijzigingen zijn
          git diff
          git add kubernetes/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update Deployment to ${{ needs.bump-version.outputs.new_version }}"
            git push
          else
            echo "No changes to commit"
          fi

  deploy-to-kubernetes:
    needs: update-deployment
    runs-on: ubuntu-latest
    steps:
      - name: Update Kubernetes Deployment via Argo CD
        uses: argoproj-labs/argocd-image-updater@v1.0.0
        with:
          argocd-server: ${{ env.ARGOCD_SERVER }}
          argocd-token: ${{ secrets.ARGOCD_TOKEN }}
          application-name: ${{ env.ARGOCD_APP_NAME }}
          image: ${{ env.DOCKER_IMAGE }}
          tag: ${{ needs.bump-version.outputs.new_version }}
          force-update: true
