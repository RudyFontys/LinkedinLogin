<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Bovenste afbeelding -->
    <div class="top-logo fade-in">
        <img src="/img/aaarch.jpg" alt="AAArch Logo">
    </div>

    <!-- Login container -->
    <div class="login-container slide-up">
        <h1>Welkom</h1>
        <p>Login een beetje veilig met je LinkedIn account</p>
        <button class="linkedin-btn" onclick="login()">
            Inloggen met LinkedIn
        </button>
    </div>

    <!-- Onderste afbeelding -->
    <div class="bottom-logo fade-in">
        <img src="/img/linkedin-logo.png" alt="LinkedIn logo">
    </div>

    <script>
        function login() {
            window.location.href = "/login";
        }
    </script>
</body>
</html>
