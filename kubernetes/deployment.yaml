apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedin-app
  namespace: linkedin-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkedin-app
  template:
    metadata:
      labels:
        app: linkedin-app
    spec:
      containers:
      - name: linkedin-app
        image: rudyfontys/linkedin-app:latest
        ports:
        - containerPort: 80
        env:
        - name: LINKEDIN_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: linkedin-api
              key: client_id
        - name: LINKEDIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: linkedin-api
              key: client_secret