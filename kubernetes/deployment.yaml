apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedin-app
  namespace: linkedin-app
spec:
  replicas: 2  # (Je kunt later meer replicas toevoegen)
  selector:
    matchLabels:
      app: linkedin-app
  template:
    metadata:
      labels:
        app: linkedin-app
    spec:
      containers:
      - name: linkedin-app
        image: rudyfontys/linkedin-app:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: linkedin-html-storage
          mountPath: /usr/share/nginx/html  # Waar je HTML-bestanden staan
      volumes:
      - name: linkedin-html-storage
        persistentVolumeClaim:
          claimName: linkedin-app-pvc  # Verwijst naar de PVC