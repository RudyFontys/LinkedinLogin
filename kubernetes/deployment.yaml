apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedin-app
  namespace: linkedin-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkedin-app
  template:
    metadata:
      labels:
        app: linkedin-app
    spec:
      containers:
      - name: linkedin-app
        image: rudyfontys/linkedin-app:latest
        ports:
        - containerPort: 80
