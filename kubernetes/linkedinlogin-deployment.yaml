apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedinlogin
  namespace: linkedinlogin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkedinlogin
  template:
    metadata:
      labels:
        app: linkedinlogin
    spec:
    #  securityContext:  # aanpassen rechten voor Longhorn (door installatiefout)
    #    runAsUser: 1000
    #    fsGroup: 1000
    #  initContainers:
    #    - name: fix-permissions
    #      image: busybox:latest
    #      command:
    #        - sh
    #        - -c
    #        - |
    #          mkdir -p /data/appendonlydir
    #          chown -R 1000:1000 /data
    #          chmod -R 700 /data
      containers:
      - name: linkedinlogin
        image: rudyfontys/linkedin-login:v1.0.1  # Wordt automatisch bijgewerkt door Argo CD
        ports:
        - containerPort: 80
    #    volumeMounts:
    #    - name: html-data
    #      mountPath: /usr/share/nginx/html  # Aanpassen aan je applicatie
    #  volumes:
    #  - name: html-data
    #    persistentVolumeClaim:
    #      claimName: linkedinlogin-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: linkedinlogin-service
  namespace: linkedinlogin
spec:
  type: LoadBalancer
  loadBalancerIP: 10.255.255.230  # MetalLB IP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: linkedinlogin